name: Build V2BOX Android APKs

on:
  push:
    branches: [main, v2box-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Build hev tunnel for Android
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/
      - name: Download pinned Xray library
        run: |
          test "$(git -C AndroidLibXrayLite rev-parse HEAD)" = 3b5a9c858c4dc98b7079cefb1380537b6b5c155c
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 --output V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar
      - name: Build signed debug APKs for ARMv7 and ARMv8
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug '-PABI_FILTERS=armeabi-v7a;arm64-v8a' --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: V2BOX-1-armeabi-v7a
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: V2BOX-1-arm64-v8a
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
          if-no-files-found: error
