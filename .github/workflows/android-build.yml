name: Build V2BOX Android APK

on:
  push:
    branches: [main, v2box-development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Build hev tunnel for Android
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/
      - name: Download pinned Xray library
        run: |
          test "$(git -C AndroidLibXrayLite rev-parse HEAD)" = 3b5a9c858c4dc98b7079cefb1380537b6b5c155c
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 --output V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar
      - name: Create a unique preview signing certificate
        run: |
          store="$RUNNER_TEMP/v2box-preview.jks"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -alias v2boxpreview -keyalg RSA -keysize 3072 \
            -validity 3650 -dname 'CN=V2BOX Preview,O=MobileTina' \
            -keystore "$store" -storepass "$password" -keypass "$password"
          fingerprint="$(keytool -exportcert -alias v2boxpreview -keystore "$store" \
            -storepass "$password" | sha256sum | cut -d' ' -f1)"
          test "${#fingerprint}" -eq 64
          echo "V2BOX_SIGNING_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "V2BOX_SIGNING_STORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo 'V2BOX_SIGNING_KEY_ALIAS=v2boxpreview' >> "$GITHUB_ENV"
          echo "V2BOX_SIGNING_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TRUSTED_SIGNER_SHA256=$fingerprint" >> "$GITHUB_ENV"
      - name: Build one obfuscated signed release APK for ARMv7 and ARMv8
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreRelease -PCOMBINED_ARM_APK=true \
            -PTRUSTED_SIGNER_SHA256="$TRUSTED_SIGNER_SHA256" --stacktrace
      - name: Verify signer, obfuscation, and both native ABIs
        run: |
          apk=V2rayNG/app/build/outputs/apk/playstore/release/app-playstore-release.apk
          test -f "$apk"
          test "$(find V2rayNG/app/build/outputs/apk/playstore/release -name '*.apk' | wc -l)" -eq 1
          mapping=V2rayNG/app/build/outputs/mapping/playstoreRelease/mapping.txt
          test -s "$mapping"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 24 \
            --print-certs "$apk" | grep -F "Signer #1 certificate SHA-256 digest: $TRUSTED_SIGNER_SHA256"
          python3 - "$apk" "$TRUSTED_SIGNER_SHA256" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              dex = (name for name in archive.namelist() if name.endswith('.dex'))
              assert any(sys.argv[2].encode() in archive.read(name) for name in dex), 'Trusted signer missing from APK'
          PY
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | \
            grep -F "package: name='com.v2box.mobiletina' versionCode='1' versionName='1'"
          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 "$apk" | grep -Fx "lib/${abi}/libgojni.so"
            unzip -Z1 "$apk" | grep -Fx "lib/${abi}/libhev-socks5-tunnel.so"
          done
          if unzip -Z1 "$apk" | grep -Eq '^lib/(x86|x86_64)/'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: V2BOX-1-obfuscated-universal-arm
          path: V2rayNG/app/build/outputs/apk/playstore/release/app-playstore-release.apk
          if-no-files-found: error

  publish-preview:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish preview]')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: V2BOX-1-obfuscated-universal-arm
          path: dist/
      - name: Publish directly downloadable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/app-playstore-release.apk dist/V2BOX-1-obfuscated-universal-arm.apk
          (cd dist && sha256sum V2BOX-1-*.apk > SHA256SUMS)
          gh release create v1-preview-ui \
            dist/V2BOX-1-obfuscated-universal-arm.apk \
            dist/SHA256SUMS \
            --title 'V2BOX 1 UI preview' \
            --notes 'One obfuscated ARMv7 and ARMv8 preview APK. Each CI build uses a fresh signing key; back up settings before uninstalling any earlier build.' \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA"
